name: Network sources and NAS compatibility

on:
  pull_request:
    paths:
      - 'lib/services/sources/local_network_access.dart'
      - 'lib/services/sources/smb_service.dart'
      - 'lib/services/sources/webdav_service.dart'
      - 'lib/features/settings/screens/network_server_edit_screen.dart'
      - 'rust/src/api/smb_api.rs'
      - 'test/services/smb_service_parse_test.dart'
      - 'test/services/webdav_service_test.dart'
      - 'test/services/webdav_sync_integration_test.dart'
      - 'test/services/local_network_access_test.dart'
      - '.github/workflows/network-sources-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - name: Analyze network implementations and settings
        run: >-
          dart analyze
          lib/services/sources/local_network_access.dart
          lib/services/sources/smb_service.dart
          lib/services/sources/webdav_service.dart
          lib/features/settings/screens/network_server_edit_screen.dart
      - name: Run SMB, WebDAV and Android LAN permission regressions
        run: >-
          flutter test --no-pub
          test/services/smb_service_parse_test.dart
          test/services/webdav_service_test.dart
          test/services/webdav_sync_integration_test.dart
          test/services/local_network_access_test.dart
      - name: Run Rust SMB transport tests
        run: cargo test --locked --lib --manifest-path rust/Cargo.toml smb_api
      - name: Compile mobile network code into Android test APK
        run: flutter build apk --debug --flavor full --target-platform android-arm64 --no-pub
      - name: Verify dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
